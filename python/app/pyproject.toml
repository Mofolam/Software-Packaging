
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-packaging-app"
version = "1.0.0"
description = "Django application for the Software Packaging project"
authors = [
    {name = "Mofolam"}
]
requires-python = ">=3.12"
dependencies = [
    "Django==6.1.3"
]

[tool.setuptools]
py-modules = ["manage"]

[tool.setuptools.packages.find]
include = ["config*"]
